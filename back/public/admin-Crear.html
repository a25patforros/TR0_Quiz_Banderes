<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Preguntes - Administració</title>
    <link href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.8/dist/quartz/bootstrap.min.css" rel="stylesheet">  
</head>
<body>
    <a href="admin.html" class="position-absolute top-0 end-0 mx-2 text-decoration-none">
        ← Panell Administració
    </a>
    <h1 class="text-center mt-3">Formulari</h1>
    <div class="card border-light mb-3 w-50 mx-auto mt-2">
        <div class="card-header" id="titolFormulari"></div>
        <form class="mx-4 mt-2">
            <fieldset>
                <div>
                    <label for="formFile" class="form-label">Adjunta una imatge</label>
                    <input class="form-control" type="file" id="formFile" name= "imgBandera">
                </div>
                <!-- Respostes -->
                <div>
                    <label for="respostesForm1" class="form-label mt-3">Resposta 1</label>
                    <input type="text" class="form-control" id="respostesForm1" placeholder="Escriu una resposta" required>
                </div>
                <div>
                    <label for="respostesForm2" class="form-label mt-2">Resposta 2</label>
                    <input type="text" class="form-control" id="respostesForm2" placeholder="Escriu una resposta" required>
                </div>
                <div>
                    <label for="respostesForm3" class="form-label mt-2">Resposta 3</label>
                    <input type="text" class="form-control" id="respostesForm3" placeholder="Escriu una resposta" required>
                </div>
                <div>
                    <label for="respostesForm4" class="form-label mt-2">Resposta 4</label>
                    <input type="text" class="form-control" id="respostesForm4" placeholder="Escriu una resposta" required>
                </div>
                <!-- RESPOSTA CORRECTA -->

                <label class="form-label mt-3">Selecciona la resposta correcta: </label>
                 <div class="form-check">
                    <input class="form-check-input" type="radio" name="respostesRadios" id="respostaCorrecta1" value="1" checked>
                    <label class="form-check-label" for="respostaCorrecta1">Resposta 1</label>
                </div>

                <div class="form-check">
                    <input class="form-check-input" type="radio" name="respostesRadios" id="respostaCorrecta2" value="2">
                    <label class="form-check-label" for="respostaCorrecta2">Resposta 2</label>
                </div>

                <div class="form-check">
                    <input class="form-check-input" type="radio" name="respostesRadios" id="respostaCorrecta3" value="3">
                    <label class="form-check-label" for="respostaCorrecta3">Resposta 3</label>
                </div>
                
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="respostesRadios" id="respostaCorrecta4" value="4">
                    <label class="form-check-label" for="respostaCorrecta4">Resposta 4</label>
                </div>
            </fieldset>

            <button type="submit" class="btn btn-primary mt-3 mb-4">
                Envia
            </button>
        </form>
    </div>
    <div class="modal fade" id="modalPreguntaCreada" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Pregunta creada!</h5>
            </div>
            <div class="modal-body">
                <p>
                    La pregunta s'ha creat correctament.
                    <br>
                    Què vols fer ara?
                </p>
            </div>

            <div class="modal-footer">
                <button type="button" class="btn btn-primary" id="tornarPanell">Torna al panell</button>
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" id="btnCrearAltra">Crear una altra</button>
            </div>
            </div>
        </div>
    </div>
     <div class="modal fade" id="modalPreguntaEdit" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Pregunta modificada!</h5>
            </div>
            <div class="modal-body">
                <p>
                    La pregunta s'ha modificat correctament.
                    <br>
                    Què vols fer ara?
                </p>
            </div>

            <div class="modal-footer">
                <button type="button" class="btn btn-primary" id="tornarPanellM">Torna al panell</button>
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" id="btnEditAltra">Modifica una altra</button>
            </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="admin.js"></script>
</body>
</html>
